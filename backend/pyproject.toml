[project]
name = "albion-ventas-gremio"
version = "0.1.0"
description = "Gestión de ventas del gremio en Albion Online (servidor Americas)"
requires-python = ">=3.12"
dependencies = ["aiosqlite>=0.20", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
